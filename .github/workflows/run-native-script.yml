name: 🚀 Cloud Mixar Compiler (Modern Toolchain Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Forces GitHub to use its newest container with modern compilers
    steps:
      - name: Checkout Source Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update Package Repositories
        run: |
          sudo apt-get update

      - name: Install Graphic and Compression Dependencies
        run: |
          sudo apt-get install -y git python3 python3-pip rsync build-essential cmake \
            libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxinerama-dev libegl-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libdbus-1-dev

      - name: Run Native Build Script
        run: |
          # Ensure execution bits are set on the target script path
          chmod +x ./scripts/unix/build.sh
          ./scripts/unix/build.sh

      - name: Upload Finished Linux Package
        uses: actions/upload-artifact@v4
        with:
          name: mixar-linux-build
          path: ./build/
          retention-days: 5
