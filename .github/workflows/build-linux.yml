name: Build Mixar Linux Client

on:
  workflow_dispatch: # Allows you to trigger the build manually with a click

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3 python3-pip rsync build-essential cmake

      - name: Run Mixar Compilation Script
        run: |
          chmod +x ./scripts/linux/build.sh
          ./scripts/linux/build.sh

      - name: Upload Finished Program Package
        uses: actions/upload-artifact@v4
        with:
          name: mixar-linux-build
          path: ./build/ # Adjusts path based on where build.sh outputs the folder
          retention-days: 5
