name: Build Mixar Linux Client

on:
  workflow_dispatch: # Allows you to trigger the build manually with a click

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3 python3-pip rsync build-essential cmake

      - name: Locate and Run Mixar Compilation Script
        run: |
          # Automatically find any build.sh file anywhere in the directory tree
          SCRIPT_PATH=$(find . -name "build.sh" | grep -i "linux" | head -n 1)
          
          if [ -z "$SCRIPT_PATH" ]; then
            echo "❌ Error: Could not find build.sh in this repository branch!"
            echo "Current files in repository:"
            ls -R
            exit 1
          fi
          
          echo "Found build script at: $SCRIPT_PATH"
          chmod +x "$SCRIPT_PATH"
          cd $(dirname "$SCRIPT_PATH")
          ./build.sh

      - name: Upload Finished Program Package
        uses: actions/upload-artifact@v4
        with:
          name: mixar-linux-build
          path: ./**/build/ # Dynamic matching to find the output folder wherever it builds
          retention-days: 5
